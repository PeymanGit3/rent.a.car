<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search_hands_free" />
  
  <title>LuxRent</title>
  <link rel="stylesheet" href="car.css" />
</head>
<body class="registerr">

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <h2 class="logo"><a href="./index.html">LuxRent</a></h2>
      <!-- GUEST MENU -->
    <div id="guestMenu">
      <button class="btn-primary"><a href="./registr.html">რეგისტრაცია</a></button>
    </div>

    <!-- USER MENU -->
    <div id="userMenu">
      <button class="nav-btn" id="notificationBtn">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button class="nav-btn" id="notificationBtn">
        <i class="fa-solid fa-bell"></i>
      </button>
      <button class="nav-btn" id="notificationBtn"><a href="./profile.html">
        <i class="fa-solid fa-user"></i></a>
      </button>
      <button class="nav-btn logout-btn" id="logoutBtn">გამოსვლა</button>
    </div>
    </div>

    
  </header>


<main class="profile-page">

  <div class="profile-wrapper">

    <div id="mainContent">

      <!-- PROFILE HEADER -->
      <section class="profile-hero">
        <div class="profile-hero-inner">

          <div class="avatar">
            FI
          </div>

          <div class="profile-info">
            <h1>Fatih Yilmaz</h1>
            <p>
              <i class="fa-solid fa-phone"></i>
              591299899
            </p>

<div class="profile-stats">

<div class="stat">
<div class="stat-num" id="statRented">0</div>
<div class="stat-label">ნაქირავები</div>
</div>

<div class="stat">
<div class="stat-num" id="statFav">0</div>
<div class="stat-label">მოწონებული</div>
</div>

<div class="stat">
<div class="stat-num" id="statMy">0</div>
<div class="stat-label">ჩემი მანქანები</div>
</div>

</div>
          </div>

        </div>
      </section>


      <!-- TABS -->
<section class="tabs-bar">

<div class="profile-main">

<div id="tab-rented" class="tab-panel active"></div>

<div id="tab-favs" class="tab-panel"></div>

<div id="tab-mycars" class="tab-panel"></div>

</div>

<div class="tabs-inner">

<button class="tab-btn active" data-tab="rented">
<i class="fa-solid fa-key"></i>
ნაქირავები მანქანები
</button>

<button class="tab-btn" data-tab="favs">
<i class="fa-solid fa-heart"></i>
მოწონებული
</button>

<button class="tab-btn" data-tab="mycars">
<i class="fa-solid fa-car"></i>
ჩემი განცხადებები
</button>

</div>
</section>




    </div>

  </div>

</main>

  

    <script src="rent.js"></script>
    <script src="nav.js"></script>
    <script src="prof.js"></script>
    <script src="favorites.js"></script>

</body>
</html>
