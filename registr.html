<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search_hands_free" />
  
  <title>LuxRent</title>
  <link rel="stylesheet" href="car.css" />
</head>
<body class="registr" style="background-color: white;">

      <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <h2 class="logo"><a href="./index.html">LuxRent</a></h2>
      <button class="btn-primary"><a href="./registr.html">რეგისტრაცია</a></button>
    </div>
  </header>


  <section class="register-section">

  <div class="register-container" id="registerContainer">

    <!-- SOL TARAF -->
    <div class="register-left">
      

      <form id="registerForm">

        <input type="tel" placeholder="ტელეფონის ნომერი" id="phone" required>
        <input type="text" placeholder="სახელი" id="name" required>
        <input type="text" placeholder="გვარი" id="surname" required>
        <input type="email" placeholder="მეილი" id="email" required>
        <input type="password" placeholder="პაროლი" id="password" required>

        <button type="submit">რეგისტრაცია</button>

      </form>

      <a href="#" class="login-link">
        უკვე ავტორიზებული ხართ? შედით თქვენი ანგარიშით
      </a>

    </div>


    <!-- SAĞ TARAF -->
    <div class="register-right">
      <img src="imgs/forreg.jpeg" alt="Car Image">
    </div>

  </div>

<div id="successMessage" style="display:none; text-align:center; margin-top:120px;">

  <img src="imgs/tik..jpg" style="width:250px">

  <h2>თქვენ წარმატებით გაიარეთ რეგისტრაცია</h2>

  <p>თქვენ გადამისამართდებით შესვლის გვერდზე...</p>

</div>

</section>



<script src="rent.js"></script>

</body>
</html>
